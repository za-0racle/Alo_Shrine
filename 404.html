<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page Not Found | Khaleed O. Adedokun</title>
    <meta
      name="description"
      content="The page you requested could not be found."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      try {
        const savedTheme = localStorage.getItem("khaleed-theme");
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/css/app.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main-content">
      <section class="hero-home">
        <div class="container" style="text-align: center">
          <div class="reveal">
            <span class="eyebrow">Error 404</span>
            <h1 style="margin: 24px auto; max-width: 800px">
              Looks like this page took a different route.
            </h1>
            <p class="lead" style="margin: 0 auto 30px">
              Let's get you back to something useful.
            </p>
            <div class="button-row" style="justify-content: center">
              <a class="button" href="/">Go Home</a
              ><a class="button button-secondary" href="/projects.html"
                >Explore Projects</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
